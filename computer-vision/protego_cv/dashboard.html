<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Protego - Live PPE & Identity Compliance</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#272e3a; --text:#e6edf3;
    --muted:#8b949e; --ok:#2ea043; --bad:#e5484d; --warn:#d29922; --accent:#388bfd;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;justify-content:space-between;
         padding:18px 26px;border-bottom:1px solid var(--line);background:var(--panel)}
  h1{font-size:18px;margin:0;letter-spacing:.3px}
  h1 span{color:var(--accent)}
  .meta{font-size:13px;color:var(--muted)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  .live{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .idle{background:var(--muted)}
  .stats{display:flex;gap:14px;padding:18px 26px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:14px 18px;min-width:120px}
  .stat .n{font-size:26px;font-weight:700}
  .stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .stat.bad .n{color:var(--bad)} .stat.ok .n{color:var(--ok)}
  .camwrap{padding:8px 26px 0}
  .cam{width:100%;max-width:760px;border:1px solid var(--line);border-radius:12px;
       display:block;background:#000}
  .camlabel{font-size:12px;color:var(--muted);margin:6px 2px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
        gap:14px;padding:8px 26px 40px}
  .card{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line);
        border-radius:10px;padding:16px}
  .card.ok{border-left-color:var(--ok)}
  .card.bad{border-left-color:var(--bad)}
  .card.stale{opacity:.45}
  .wid{font-size:20px;font-weight:700}
  .badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;
         border-radius:20px;margin-top:8px}
  .badge.ok{background:rgba(46,160,67,.15);color:var(--ok)}
  .badge.bad{background:rgba(229,72,77,.15);color:var(--bad)}
  .sub{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
  .empty{padding:30px 26px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
  <header>
    <h1><span>Protego</span> - PPE &amp; Identity Compliance</h1>
    <div class="meta"><span id="status-dot" class="dot idle"></span><span id="status">waiting for feed...</span></div>
  </header>

  <div class="stats">
    <div class="stat"><div class="n" id="s-total">0</div><div class="l">Workers</div></div>
    <div class="stat ok"><div class="n" id="s-ok">0</div><div class="l">Compliant</div></div>
    <div class="stat bad"><div class="n" id="s-bad">0</div><div class="l">Missing helmet</div></div>
  </div>

  <div class="camwrap" id="camwrap" style="display:none">
    <img class="cam" id="cam" alt="live camera" />
    <div class="camlabel">Live camera - green box = helmet OK, red box = missing helmet</div>
  </div>
  <div class="camwrap" id="nocam"><div class="camlabel" id="nocam-msg">Connecting to camera...</div></div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No workers detected yet.</div>

<script>
const $ = id => document.getElementById(id);

// --- live video: MJPEG stream first, snapshot polling as a fallback ----------
let camMode = null, camTries = 0, pollTimer = null;
function showCam(){ $("camwrap").style.display="block"; $("nocam").style.display="none"; }
function waitingCam(msg){ $("camwrap").style.display="none"; $("nocam").style.display="block"; $("nocam-msg").textContent=msg; }

function startSnapshotPolling(){
  if(camMode==="poll") return;
  camMode = "poll";
  const img = $("cam");
  img.onload = showCam;
  img.onerror = () => waitingCam("Waiting for camera... is run_dashboard_cam.py running?");
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => { img.src = "/snapshot?t=" + Date.now(); }, 80); // ~12 fps
}

function attachStream(){
  const img = $("cam");
  let gotFrame = false;
  img.onload = () => { gotFrame = true; camMode = "stream"; showCam(); };
  img.onerror = () => {
    camTries++;
    if(camTries >= 2){ startSnapshotPolling(); return; }
    waitingCam("Connecting to camera stream...");
    setTimeout(() => { img.src = "/stream?t=" + Date.now(); }, 1200);
  };
  img.src = "/stream?t=" + Date.now();
  setTimeout(() => { if(!gotFrame && camMode!=="stream") startSnapshotPolling(); }, 3500);
}
attachStream();

function card(w){
  const ok = w.helmet;
  const cls = (ok ? "ok" : "bad") + (w.stale ? " stale" : "");
  return '<div class="card '+cls+'">'
    + '<div class="wid">Worker #'+w.worker+'</div>'
    + '<span class="badge '+(ok?"ok":"bad")+'">'+(ok?"HELMET OK":"MISSING HELMET")+'</span>'
    + '<div class="sub">helmet conf: '+(w.helmet_conf??0)+'<br>badge conf: '+(w.badge_conf??0)
    + '<br>'+(w.stale?"last seen &gt;10s ago":"live")+'</div></div>';
}

async function tick(){
  try{
    const r = await fetch("/api/state",{cache:"no-store"});
    const d = await r.json();
    const ws = d.workers || [];
    const live = d.last_payload_ts && (d.now - d.last_payload_ts) < 8;
    $("status-dot").className = "dot " + (live ? "live" : "idle");
    $("status").textContent = live ? "live feed" : (d.last_payload_ts ? "feed idle" : "waiting for feed...");
    $("s-total").textContent = ws.length;
    $("s-ok").textContent  = ws.filter(w=>w.helmet).length;
    $("s-bad").textContent = ws.filter(w=>!w.helmet).length;
    $("empty").style.display = ws.length ? "none" : "block";
    $("grid").innerHTML = ws.map(card).join("");
  }catch(e){
    $("status").textContent = "dashboard server not reachable";
    $("status-dot").className = "dot idle";
  }
}
tick();
setInterval(tick, 1500);
</script>
</body>
</html>

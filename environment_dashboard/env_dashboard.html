<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Protego - Environment Monitor</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#272e3a; --text:#e6edf3; --muted:#8b949e;
    --ok:#2ea043; --warn:#d29922; --bad:#e5484d; --accent:#388bfd;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;justify-content:space-between;
         padding:18px 26px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;gap:10px}
  h1{font-size:18px;margin:0}
  h1 span{color:var(--accent)}
  .meta{font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  .on{background:var(--ok);box-shadow:0 0 8px var(--ok)} .off{background:var(--bad)}
  #alertbar{padding:0 26px}
  .alert{margin-top:14px;border-radius:10px;padding:12px 16px;font-weight:600;
         display:flex;align-items:center;gap:10px}
  .alert.danger{background:rgba(229,72,77,.15);border:1px solid var(--bad);color:#ff9ea1}
  .alert.warn{background:rgba(210,153,34,.15);border:1px solid var(--warn);color:#f1d18a}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;padding:18px 26px}
  .card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--line);
        border-radius:14px;padding:22px}
  .card.ok{border-top-color:var(--ok)} .card.warn{border-top-color:var(--warn)} .card.danger{border-top-color:var(--bad)}
  .card .top{display:flex;justify-content:space-between;align-items:center}
  .ctitle{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
  .pill.ok{background:rgba(46,160,67,.2);color:var(--ok)}
  .pill.warn{background:rgba(210,153,34,.2);color:var(--warn)}
  .pill.danger{background:rgba(229,72,77,.2);color:var(--bad)}
  .pill.unknown{background:rgba(139,148,158,.2);color:var(--muted)}
  .big{font-size:48px;font-weight:300;margin:10px 0 2px}
  .big .u{font-size:18px;color:var(--muted);margin-left:4px}
  .limits{font-size:12px;color:var(--muted)}
  .spark{margin-top:14px;width:100%;height:48px;display:block}
  .footer{padding:6px 26px 30px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
  <header>
    <h1><span>Protego</span> - Environment Monitor</h1>
    <div class="meta">
      <span><span id="dev-dot" class="dot off"></span><span id="dev-status">connecting...</span></span>
      <span id="dev-ip"></span><span id="dev-rssi"></span><span id="dev-uptime"></span>
    </div>
  </header>

  <div id="alertbar"></div>

  <div class="grid" id="grid"></div>
  <div class="footer" id="footer"></div>

<script>
const $ = s => document.querySelector(s);
const KEYS = ["co","temperature","humidity"];
const ICON = {co:"☢️", temperature:"🌡️", humidity:"💧"};

function spark(vals, level){
  const v = vals.filter(x => x!==null && x!==undefined);
  if(v.length < 2) return "";
  const w=260, h=48, min=Math.min(...v), max=Math.max(...v), rng=(max-min)||1;
  const col = level==="danger"?"#e5484d":level==="warn"?"#d29922":"#2ea043";
  const pts = v.map((x,i)=>{
    const px = (i/(v.length-1))*w;
    const py = h - ((x-min)/rng)*(h-6) - 3;
    return px.toFixed(1)+","+py.toFixed(1);
  }).join(" ");
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'
    + '<polyline fill="none" stroke="'+col+'" stroke-width="2" points="'+pts+'"/></svg>';
}

function card(key, r, hist){
  const lvl = r.level;
  const val = (r.value===null||r.value===undefined) ? "--" : r.value;
  const pillTxt = {ok:"NORMAL",warn:"WARNING",danger:"DANGER",unknown:"NO DATA"}[lvl];
  return '<div class="card '+lvl+'">'
    + '<div class="top"><span class="ctitle">'+ICON[key]+' '+r.label+'</span>'
    + '<span class="pill '+lvl+'">'+pillTxt+'</span></div>'
    + '<div class="big">'+val+'<span class="u">'+r.unit+'</span></div>'
    + '<div class="limits">warn &ge; '+r.warn+r.unit+' &nbsp;|&nbsp; danger &ge; '+r.danger+r.unit+'</div>'
    + spark(hist[key]||[], lvl)
    + '</div>';
}

async function tick(){
  try{
    const d = await (await fetch("/api/state",{cache:"no-store"})).json();
    const dev = d.device;
    const online = dev.online && !dev.stale;
    $("#dev-dot").className = "dot " + (online?"on":"off");
    $("#dev-status").textContent = online ? "ESP online" : (dev.error ? "ESP unreachable" : "waiting...");
    $("#dev-ip").textContent = dev.ip ? ("IP: "+dev.ip) : "";
    $("#dev-rssi").textContent = (dev.rssi!==null&&dev.rssi!==undefined) ? ("RSSI: "+dev.rssi+" dBm") : "";
    $("#dev-uptime").textContent = (dev.uptime!==null&&dev.uptime!==undefined) ? ("Uptime: "+dev.uptime+"s") : "";

    // alerts
    let ab = "";
    (d.alerts||[]).forEach(a=>{
      ab += '<div class="alert '+a.level+'">'
        + (a.level==="danger"?"🚨":"⚠️")
        + ' '+a.label.toUpperCase()+' '+(a.level==="danger"?"DANGER":"WARNING")
        + ': '+a.value+a.unit+' (limit '+a.limit+a.unit+')</div>';
    });
    if(!online && dev.error){
      ab = '<div class="alert danger">🚨 Cannot reach ESP at the configured address. Check the device IP and Wi-Fi.</div>' + ab;
    }
    $("#alertbar").innerHTML = ab;

    $("#grid").innerHTML = KEYS.map(k=>card(k, d.readings[k], d.history)).join("");
    $("#footer").textContent = "Polling every "+d.poll_every+"s | "+new Date(d.now*1000).toLocaleTimeString();
  }catch(e){
    $("#dev-status").textContent = "dashboard server not reachable";
    $("#dev-dot").className = "dot off";
  }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Protego — Safety Compliance</title>
<style>
  :root{ --text:#e9eef6; --muted:#8b97ad; --accent:#5b8cff; --accent2:#a06bff; }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; background:#05060a; color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; overflow:hidden}
  #bg{position:fixed; inset:0; z-index:0; display:block}
  /* subtle dark vignette + bottom fade for legibility */
  .veil{position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 30%, rgba(5,6,10,0) 40%, rgba(5,6,10,.7) 100%),
               linear-gradient(180deg, rgba(5,6,10,.55) 0%, rgba(5,6,10,0) 30%, rgba(5,6,10,.85) 100%);}
  .wrap{position:relative; z-index:2; height:100%; display:flex; flex-direction:column;
    justify-content:center; align-items:center; text-align:center; padding:24px}
  .brand{font-size:13px; letter-spacing:.42em; color:var(--muted); text-transform:uppercase;
    margin-bottom:26px; opacity:0}
  .title{font-weight:800; letter-spacing:.06em; line-height:.95;
    font-size:clamp(56px,13vw,160px);
    background:linear-gradient(180deg,#ffffff 0%,#aab6cf 60%,#5f6b85 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 60px rgba(91,140,255,.18)}
  .title .c{display:inline-block; will-change:transform,opacity}
  .subtitle{margin-top:22px; color:var(--muted); font-size:clamp(14px,1.8vw,19px);
    line-height:1.7; max-width:620px}
  .subtitle .ln{opacity:0}
  .cta{margin-top:46px; opacity:0}
  .btn{appearance:none; cursor:pointer; border:1px solid rgba(91,140,255,.5);
    background:linear-gradient(180deg, rgba(91,140,255,.16), rgba(160,107,255,.10));
    color:#eaf0ff; font-size:15px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    padding:15px 38px; border-radius:40px; backdrop-filter:blur(6px);
    transition:transform .18s ease, box-shadow .25s ease, border-color .25s ease;
    box-shadow:0 0 0 rgba(91,140,255,0)}
  .btn:hover{transform:translateY(-2px); border-color:rgba(91,140,255,.9);
    box-shadow:0 10px 40px rgba(91,140,255,.28)}
  .btn .arrow{margin-left:10px; transition:transform .18s ease; display:inline-block}
  .btn:hover .arrow{transform:translateX(4px)}
  .links{margin-top:22px; display:flex; gap:20px; font-size:13px; opacity:0}
  .links a{color:var(--muted); text-decoration:none; border-bottom:1px solid transparent; padding-bottom:2px}
  .links a:hover{color:var(--text); border-color:var(--accent)}
  .foot{position:fixed; bottom:18px; left:0; right:0; z-index:2; text-align:center;
    color:#566; font-size:11px; letter-spacing:.18em; text-transform:uppercase}
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="veil"></div>

  <div class="wrap">
    <div class="brand" id="brand">Protego · Site Safety Intelligence</div>
    <h1 class="title" id="title">PROTEGO</h1>
    <div class="subtitle">
      <p class="ln">Where vision meets safety —</p>
      <p class="ln">real-time PPE, identity &amp; environment compliance.</p>
    </div>
    <div class="cta">
      <button class="btn" onclick="window.location.href='/dashboard'">
        Start Now <span class="arrow">→</span>
      </button>
    </div>
    <div class="links" id="links">
      <a href="/dashboard#vision">Computer Vision</a>
      <a href="/dashboard#env">Environment</a>
    </div>
  </div>
  <div class="foot">Cosmos Hackathon · Protego</div>

<script src="/vendor/three.min.js"></script>
<script src="/vendor/gsap.min.js"></script>
<script>
// ---------------- Three.js starfield (dark cosmos) ----------------
(function(){
  if(!window.THREE){ return; }
  const canvas = document.getElementById('bg');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x05060a, 0.00045);
  const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 2000);
  camera.position.set(0, 18, 120);

  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.42;   // keep it dim, not bright

  const layers = [];
  const STAR = 4200;
  for(let L=0; L<3; L++){
    const g = new THREE.BufferGeometry();
    const pos = new Float32Array(STAR*3), col = new Float32Array(STAR*3), sz = new Float32Array(STAR);
    for(let j=0;j<STAR;j++){
      const r = 220 + Math.random()*760;
      const th = Math.random()*Math.PI*2, ph = Math.acos(Math.random()*2-1);
      pos[j*3]   = r*Math.sin(ph)*Math.cos(th);
      pos[j*3+1] = r*Math.sin(ph)*Math.sin(th);
      pos[j*3+2] = r*Math.cos(ph);
      const c = new THREE.Color(), pick = Math.random();
      if(pick<0.75) c.setHSL(0,0,0.72+Math.random()*0.25);
      else if(pick<0.9) c.setHSL(0.62,0.55,0.7);   // blue
      else c.setHSL(0.74,0.5,0.7);                  // violet
      col[j*3]=c.r; col[j*3+1]=c.g; col[j*3+2]=c.b;
      sz[j]=Math.random()*1.8+0.4;
    }
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    g.setAttribute('color', new THREE.BufferAttribute(col,3));
    g.setAttribute('size', new THREE.BufferAttribute(sz,1));
    const m = new THREE.ShaderMaterial({
      uniforms:{ time:{value:0}, depth:{value:L} },
      vertexShader:`attribute float size; attribute vec3 color; varying vec3 vColor;
        uniform float time; uniform float depth;
        void main(){ vColor=color; vec3 p=position;
          float a=time*0.04*(1.0-depth*0.3);
          mat2 R=mat2(cos(a),-sin(a),sin(a),cos(a)); p.xy=R*p.xy;
          vec4 mv=modelViewMatrix*vec4(p,1.0);
          gl_PointSize=size*(300.0/-mv.z); gl_Position=projectionMatrix*mv; }`,
      fragmentShader:`varying vec3 vColor;
        void main(){ float d=length(gl_PointCoord-vec2(0.5)); if(d>0.5) discard;
          float o=1.0-smoothstep(0.0,0.5,d); gl_FragColor=vec4(vColor,o); }`,
      transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
    });
    const pts = new THREE.Points(g,m);
    scene.add(pts); layers.push(pts);
  }

  // faint nebula glow for depth (kept very subtle)
  const neb = new THREE.Mesh(
    new THREE.PlaneGeometry(6000,3000),
    new THREE.ShaderMaterial({
      uniforms:{ time:{value:0}, c1:{value:new THREE.Color(0x0a1a4a)}, c2:{value:new THREE.Color(0x2a0a4a)} },
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
      fragmentShader:`uniform vec3 c1; uniform vec3 c2; uniform float time; varying vec2 vUv;
        void main(){ float m=sin(vUv.x*6.0+time)*cos(vUv.y*6.0+time);
          vec3 col=mix(c1,c2,m*0.5+0.5);
          float a=0.16*(1.0-length(vUv-0.5)*2.0); gl_FragColor=vec4(col,max(a,0.0)); }`,
      transparent:true, blending:THREE.AdditiveBlending, side:THREE.DoubleSide, depthWrite:false
    })
  );
  neb.position.z = -900; scene.add(neb);

  let mx=0,my=0;
  addEventListener('mousemove', e=>{ mx=(e.clientX/innerWidth-0.5); my=(e.clientY/innerHeight-0.5); });
  addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight); });

  (function loop(){
    requestAnimationFrame(loop);
    const t = Date.now()*0.001;
    layers.forEach(p=>p.material.uniforms.time.value=t);
    neb.material.uniforms.time.value=t*0.4;
    camera.position.x += ((mx*30) - camera.position.x)*0.03;
    camera.position.y += ((18 - my*20) - camera.position.y)*0.03;
    camera.lookAt(0,8,-200);
    renderer.render(scene,camera);
  })();
})();

// ---------------- GSAP intro ----------------
(function(){
  const title = document.getElementById('title');
  const txt = title.textContent.trim();
  title.innerHTML = txt.split('').map(c=>`<span class="c">${c}</span>`).join('');
  if(!window.gsap){
    document.querySelectorAll('.brand,.ln,.cta,.links').forEach(e=>e.style.opacity=1);
    return;
  }
  const tl = gsap.timeline();
  tl.to('#brand',{opacity:1,duration:1,ease:'power2.out'})
    .from('.title .c',{y:160,opacity:0,duration:1.2,stagger:0.05,ease:'power4.out'},'-=0.4')
    .to('.ln',{opacity:1,y:0,duration:0.9,stagger:0.18,ease:'power3.out'},'-=0.5')
    .from('.ln',{y:30,duration:0.9,stagger:0.18,ease:'power3.out'},'<')
    .to('.cta',{opacity:1,duration:0.8,ease:'power2.out'},'-=0.4')
    .from('.cta',{y:24,duration:0.8,ease:'power2.out'},'<')
    .to('#links',{opacity:1,duration:0.8},'-=0.3');
})();
</script>
</body>
</html>
